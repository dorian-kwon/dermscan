<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DermScan - 피부 병변 분석 서비스</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; color: #333; }
        .upload-area { border: 2px dashed #ddd; padding: 30px; cursor: pointer; text-align: center; margin-bottom: 20px; border-radius: 5px; }
        .upload-area:hover { border-color: #aaa; }
        .upload-area.highlight { border-color: #007bff; background-color: #f1f8ff; }
        .preview-image { max-width: 100%; max-height: 300px; margin: 20px 0; border-radius: 5px; }
        .diagnosis-item { display: flex; justify-content: space-between; margin-bottom: 10px; padding: 10px; background: #f8f9fa; border-radius: 5px; }
        .progress-bar { height: 5px; background-color: #007bff; margin-top: 5px; }
        .loading { display: none; text-align: center; margin: 20px 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header text-center mb-4">
        <h1>DermScan</h1>
        <p>피부 병변 이미지를 업로드하여 AI 분석 결과를 확인하세요</p>
    </div>

    <div class="upload-container bg-white p-4 rounded shadow mb-4">
        <label for="model-select" class="form-label">분석 모델 선택</label>
        <select class="form-select mb-3" id="model-select">
            <option value="swin">Swin Transformer 모델</option>
            <option value="vi">Vision Transformer 모델</option>
        </select>

        <div class="upload-area" id="upload-area">
            <div id="upload-placeholder">
                <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="currentColor" class="mb-2 bi bi-cloud-arrow-up" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M7.646 5.146a.5.5 0 0 1 .708 0l2 2a.5.5 0 0 1-.708.708L8.5 6.707V10.5a.5.5 0 0 1-1 0V6.707L6.354 7.854a.5.5 0 1 1-.708-.708l2-2z"/>
                    <path d="M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773c0 1.796-1.498 3.227-3.313 3.227H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383z"/>
                </svg>
                <p>이미지를 여기에 끌어다 놓거나 클릭하여 파일을 선택하세요</p>
                <p class="text-muted small">지원 형식: JPG, JPEG, PNG (최대 16MB)</p>
            </div>
            <div id="preview-image-wrapper" style="display:none;">
                <img id="preview-image" class="preview-image" src="" alt="미리보기">
            </div>
            <input type="file" id="file-input" accept=".jpg,.jpeg,.png" style="display:none;">
        </div>

        <div class="text-center">
            <button class="btn btn-primary" id="analyze-btn" disabled>분석하기</button>
<!--?            <button class="btn btn-outline-primary" id="recrop-btn" disabled>다시 크롭하기</button>-->
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner-border text-primary" role="status"></div>
        <p>이미지를 분석 중입니다...</p>
    </div>

    <div class="result-container bg-white p-4 rounded shadow mb-4" id="result-container" style="display:none;">
        <h2>분석 결과</h2>
        <img id="result-image" class="preview-image mb-3" src="" alt="결과 이미지">
        <div id="description" class="mb-3"></div>
        <div id="diagnoses-container" class="mb-3"></div>

        <div class="text-center mb-3">
            <button class="btn btn-success me-2" id="like-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-hand-thumbs-up-fill" viewBox="0 0 16 16">
                    <path d="M6.956 1.745C7.021.81 7.908.087 8.864.325l.261.066c.463.116.874.456 1.012.965.22.816.533 2.511.062 4.51a9.84 9.84 0 0 1 .443-.051c.713-.065 1.669-.072 2.516.21.518.173.994.681 1.2 1.273.184.532.16 1.162-.234 1.733.058.119.103.242.138.363.077.27.113.567.113.856 0 .289-.036.586-.113.856-.039.135-.09.273-.16.404.169.387.107.819-.003 1.148a3.163 3.163 0 0 1-.488.901c.054.152.076.312.076.465 0 .305-.089.625-.253.912C13.1 15.522 12.437 16 11.5 16H8c-.605 0-1.07-.081-1.466-.218a4.82 4.82 0 0 1-.97-.484l-.048-.03c-.504-.307-.999-.609-2.068-.722C2.682 14.464 2 13.846 2 13V9c0-.85.685-1.432 1.357-1.615.849-.232 1.574-.787 2.132-1.41.56-.627.914-1.28 1.039-1.639.199-.575.356-1.539.428-2.59z"/>
                </svg> 좋아요
            </button>
            <button class="btn btn-danger" id="dislike-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-hand-thumbs-down-fill" viewBox="0 0 16 16">
                    <path d="M6.956 14.534c.065.936.952 1.659 1.908 1.42l.261-.065c.463-.116.874-.456 1.012-.965.22-.816.533-2.511.062-4.51.136.02.285.037.443.051.713.065 1.669.071 2.516-.211.518-.173.994-.68 1.2-1.272a1.896 1.896 0 0 0-.234-1.734c.058-.118.103-.242.138-.362.077-.27.113-.568.113-.856 0-.29-.036-.586-.113-.857a2.094 2.094 0 0 0-.16-.403c.169-.387.107-.82-.003-1.149a3.162 3.162 0 0 0-.488-.9c.054-.153.076-.313.076-.465a1.86 1.86 0 0 0-.253-.912C13.1.757 12.437.28 11.5.28H8c-.605 0-1.07.08-1.466.217a4.823 4.823 0 0 0-.97.485l-.048.029c-.504.308-.999.61-2.068.723C2.682 1.815 2 2.434 2 3.279v4c0 .851.685 1.433 1.357 1.616.849.232 1.574.787 2.132 1.41.56.626.914 1.28 1.039 1.638.199.575.356 1.54.428 2.591z"/>
                </svg> 싫어요
            </button>
        </div>
        <div id="feedback-message" class="text-success text-center" style="display:none;">피드백 감사합니다!</div>
        <div class="text-center mt-3">
            <button class="btn btn-secondary" id="new-analysis-btn">새 이미지 분석</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const uploadArea = document.getElementById('upload-area');
    const uploadPlaceholder = document.getElementById('upload-placeholder');
    const previewWrapper = document.getElementById('preview-image-wrapper');
    const previewImage = document.getElementById('preview-image');
    const fileInput = document.getElementById('file-input');
    const analyzeBtn = document.getElementById('analyze-btn');
    const recropBtn = document.getElementById('recrop-btn');
    const loading = document.getElementById('loading');
    const resultContainer = document.getElementById('result-container');
    const resultImage = document.getElementById('result-image');
    const description = document.getElementById('description');
    const diagnosesContainer = document.getElementById('diagnoses-container');
    const likeBtn = document.getElementById('like-btn');
    const dislikeBtn = document.getElementById('dislike-btn');
    const feedbackMessage = document.getElementById('feedback-message');
    const newAnalysisBtn = document.getElementById('new-analysis-btn');
    const modelSelect = document.getElementById('model-select');

    let selectedFile = null;

    // Drag-and-drop
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(event =>
        uploadArea.addEventListener(event, e => {
            e.preventDefault();
            e.stopPropagation();
        }, false)
    );
    uploadArea.addEventListener('dragover', () => uploadArea.classList.add('highlight'));
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('highlight'));
    uploadArea.addEventListener('drop', e => {
        uploadArea.classList.remove('highlight');
        handleFiles(e.dataTransfer.files);
    });

    // Click to select file
    uploadArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => handleFiles(e.target.files));

    // Clipboard paste
    document.addEventListener('paste', e => {
        const items = e.clipboardData.items;
        for (let item of items) {
            if (item.type.startsWith('image')) {
                handleFiles([item.getAsFile()]);
                break;
            }
        }
    });

    function handleFiles(files) {
        if (files.length === 0) return;
        const file = files[0];
        if (!['image/jpeg', 'image/png'].includes(file.type)) {
            alert('JPG, PNG 파일만 가능합니다.');
            return;
        }
        if (file.size > 16 * 1024 * 1024) {
            alert('16MB 이하 파일만 업로드 가능합니다.');
            return;
        }
        selectedFile = file;
        const reader = new FileReader();
        reader.onload = e => {
            previewImage.src = e.target.result;
            uploadPlaceholder.style.display = 'none';
            previewWrapper.style.display = 'block';
            analyzeBtn.disabled = false;
            recropBtn.disabled = false;
        };
        reader.readAsDataURL(file);
    }

    analyzeBtn.addEventListener('click', () => {
        if (!selectedFile) return;
        loading.style.display = 'block';
        resultContainer.style.display = 'none';
        const formData = new FormData();
        formData.append('file', selectedFile);
        formData.append('model', modelSelect.value);

        fetch('/api/analyze', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => showResults(data))
            .catch(err => alert('분석 실패: ' + err))
            .finally(() => loading.style.display = 'none');
    });

    function showResults(data) {
        resultImage.src = data.image_url;
        description.innerHTML = marked.parse(data.description);
        diagnosesContainer.innerHTML = data.diagnoses.map(d =>
            `<div class="diagnosis-item">
                <div>${d.diagnosis}</div>
                <div>${Math.round(d.probability * 100)}%</div>
                <div class="progress-bar" style="width:${Math.round(d.probability * 100)}%"></div>
            </div>`
        ).join('');
        resultContainer.style.display = 'block';
        likeBtn.disabled = false;
        dislikeBtn.disabled = false;
        feedbackMessage.style.display = 'none';
    }

    likeBtn.addEventListener('click', () => sendFeedback(1));
    dislikeBtn.addEventListener('click', () => sendFeedback(-1));

    function sendFeedback(score) {
        const diagnoses = Array.from(diagnosesContainer.querySelectorAll('.diagnosis-item')).map(item => ({
            diagnosis: item.children[0].textContent,
            probability: parseFloat(item.children[1].textContent) / 100
        }));
        fetch('/api/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                image_path: resultImage.src,
                score,
                diagnoses,
                model: modelSelect.value
            })
        }).then(() => {
            feedbackMessage.style.display = 'block';
            likeBtn.disabled = true;
            dislikeBtn.disabled = true;
        }).catch(() => alert('피드백 전송 실패'));
    }

    newAnalysisBtn.addEventListener('click', () => {
        selectedFile = null;
        fileInput.value = '';
        previewImage.src = '';
        uploadPlaceholder.style.display = 'block';
        previewWrapper.style.display = 'none';
        resultContainer.style.display = 'none';
        analyzeBtn.disabled = true;
        recropBtn.disabled = true;
    });
});

</script>
</body>
</html>
